version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Feature work lands on develop; main only moves when a release is cut.
    # A bump opened against main is tested against a branch that does not
    # carry the app, and every one merged there has to be hand-synced back.
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pub"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    groups:
      pub:
        patterns:
          - "*"
